name: CI

on:
  pull_request:
  push:
    branches:
      - master

env:
  uv-version: "0.13.9"

jobs:
  test:
    strategy:
      matrix:
        python:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          version: ${{ env.uv-version }}
      - name: Test with Nox
        run: uv run --locked --only-group nox nox -s test-${{ matrix.python }}
      - name: Store coverage
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-${{ matrix.python }}
          path: .coverage.*
          include-hidden-files: true
          if-no-files-found: error

  coverage:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          version: ${{ env.uv-version }}
      - name: Fetch coverage
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: coverage-*
          merge-multiple: true
      - name: Combine coverage and generate report
        run: uv run --locked nox -s coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  quality:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        nox-session: ["lint", "type_check"]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          version: ${{ env.uv-version }}
      - name: Check code quality with Nox
        run: uv run --locked nox -s ${{ matrix.nox-session }}

  actions-lock:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7.0.1
      - name: Verify GitHub Actions lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install github/gh-actions-lock --pin v0.5.1
          gh actions-lock --verify
